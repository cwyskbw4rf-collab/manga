services:
  - type: web
    name: manga
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_API_BASE_URL
        value: ${VITE_API_BASE_URL}
      - key: NODE_ENV
        value: production
    routes:
      - path: /
        destination: /
